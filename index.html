<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>

    <div class="container">
    
        <!--Parte Esquerda da tela-->
        <div class="login">
            <div class="section">
                <h2>Welcome Back!</h2>
                <p> To keep connected with us, please login with your personal info</p>
                
            </div>
            <button>Sign in</button>
        </div>
        
            <div class="registrar">
            <h1>Create Acconunt</h1>

            <div class="redes">
                <img class="icon" src="images/facebook.png" alt="facebook">
                <img class="icon" src="images/google.png" alt="google">
                <img class="icon" src="images/linkedin.png" alt="linkedin">
            </div>
            <p>or use for resgistration:</p>

            <form action="post">
                <input type="text" name="name" id="name" placeholder="Name" >
                <input type="email" name="email" placeholder="Email">
                <input type="password" name="password" id="password" placeholder="Password">
                <button type="submit">Sign up</button>
            </form>
        </div>
    </div>
</body>
</html>
